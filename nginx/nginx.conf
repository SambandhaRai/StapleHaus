limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nginx-cert.pem;
    ssl_certificate_key /etc/nginx/certs/nginx-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    limit_req_status 429;

    location /_next/static/ {
        proxy_pass http://frontend:3000;
    }

    location / {
        limit_req zone=edge_limit burst=100 nodelay;
        proxy_pass http://frontend:3000;
    }
}
