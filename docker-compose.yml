services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/staplehaus
      FRONTEND_URL: https://localhost
    depends_on:
      - mongo
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/certs:/app/certs:ro
    restart: unless-stopped

  seed-admin:
    build:
      context: ./backend
    command: ["node", "dist/scripts/seedAdmin.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/staplehaus
    depends_on:
      - mongo
    restart: "no"

  seed-users:
    build:
      context: ./backend
    command: ["node", "dist/scripts/seedUsers.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/staplehaus
    depends_on:
      - mongo
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://backend:5050
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://backend:5050
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
    volumes:
      - ./backend/certs:/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mongo_data:
  backend_uploads:
